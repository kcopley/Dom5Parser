# Data-fidelity suite (tools/fidelity/run.mjs): checks, through the dom6inspector oracle,
# that Dom5Parser saves preserve mod data and that edits change exactly what they should.
# quick = stages 3-4 on every push/PR; full = all stages (incl. oracle self-checks) weekly,
# on demand, and when the oracle pin or vanilla.dm changes.
name: fidelity

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all stages (incl. slow oracle self-checks)
        type: boolean
        default: true
  schedule:
    - cron: '0 6 * * 1'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      oracle: ${{ steps.diff.outputs.oracle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^(tools/fidelity/oracle-ref.txt|vanilla.dm)$'; then
            echo "oracle=true" >> "$GITHUB_OUTPUT"
          else
            echo "oracle=false" >> "$GITHUB_OUTPUT"
          fi

  fidelity:
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FULL: ${{ github.event_name == 'schedule' || inputs.full == true || needs.changes.outputs.oracle == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned oracle commit
        id: oracle
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < tools/fidelity/oracle-ref.txt)" >> "$GITHUB_OUTPUT"

      - name: Check out dom6inspector oracle
        uses: actions/checkout@v4
        with:
          repository: kcopley/dom6inspector
          ref: ${{ steps.oracle.outputs.ref }}
          path: oracle
          sparse-checkout: |
            scripts
            gamedata
            index.html

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Dom5Tests
        run: dotnet build Dom5Tests/Dom5Tests.csproj -c Debug -nologo -v:q

      - name: Fidelity suite
        shell: bash
        run: |
          if [ "$FULL" = "true" ]; then MODE=""; else MODE="--quick"; fi
          node tools/fidelity/run.mjs --oracle oracle $MODE --json fidelity-summary.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-report
          path: |
            fidelity-summary.json
            Dom5Tests/bin/fidelity/*.json
          if-no-files-found: ignore
